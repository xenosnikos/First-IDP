# Builds the platform's own container images (reaper, Nebula dashboard, Prisma
# migrate job) and
# pushes them to ECR twizz-idp. Auth is GitHub OIDC -> twizz-gha-ecr-push (no
# keys); this repo is in the role's trust (infra/src/iam.ts). Tags are
# immutable `<target>-<sha>` plus a floating `<target>-latest` that the gitops
# manifests pin by sha on promotion.
name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REGISTRY: 848281935985.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPO: twizz-idp

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [reaper, dashboard, migrate]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::848281935985:role/twizz-gha-ecr-push
          aws-region: eu-west-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ matrix.target }}-${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ matrix.target }}-latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Summary
        run: echo "pushed ${{ env.ECR_REPO }}:${{ matrix.target }}-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
