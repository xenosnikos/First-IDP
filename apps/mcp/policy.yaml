# Write-tool authorization policy. Evaluated BEFORE any AWS/GitHub call.
# Field values are glob-matched (* wildcard). A tool call is allowed only if
# every constrained field matches an allow pattern and no deny pattern.
# Anything matching global_deny is rejected regardless of tool rules.

global_deny:
  - "*prod*"
  - "*Prod*"
  - "*PROD*"
  - "*Moly-Prod*"

write_tools:
  delete_preview:
    allow:
      repo: ["twizz-app/*"]

  trigger_preview_refresh:
    allow:
      repo: ["twizz-app/*"]

  rotate_preview_secret:
    allow:
      secretName: ["preview/*"]

  scale_shared_service:
    allow:
      service: ["ffmpeg-service", "lolygram-discovery", "alertservice"]
      # replicas constrained in code to 0..3

  # ── Nebula named envs (manual model; twizz-gitops/named-envs/README.md) ──
  # Secret names and ECR repos are derived from `service` in code — never inputs.
  create_named_env:
    allow:
      service: ["moly-backend"]
      imageTag: ["build-*"]              # immutable tags only; aliases refused in code
      name: ["*"]
    deny:
      name: ["*prod*", "*staging*", "shared", "dev"]
      # ttlHours 1..336 and the live-env cap (NEBULA_MAX_NAMED_ENVS, default 6) enforced in code

  teardown_named_env:
    allow:
      name: ["*"]

  clone_staging_db:
    allow:
      name: ["*"]
      source: ["preview/moly-backend"]   # pinned in code; prod also caught by global_deny

  extend_named_env:
    allow:
      name: ["*"]
      # ttlHours 1..336 enforced in code

  # ── Build-on-provision envs (docs/NEBULA.md §N3.7): any twizz-app repo/ref ──
  # Secret names, ECR repos and image tags are derived from repo/sha in code.
  # global_deny *prod* also rejects repos/refs whose names contain "prod" (intended).
  # The dashboard folds branch creation + the config PR into this ONE gate
  # (one human confirm); `newBranch` is the branch it would create (or "").
  # Secret VALUES are never fields — their sorted NAMES are; files/env ride as hashes.
  create_env_from_repo:
    allow:
      repo: ["twizz-app/*"]
      kind: ["backend", "frontend", "worker"]
      name: ["*"]
      service: ["*"]
      sha: ["*"]
    deny:
      name: ["*prod*", "*staging*", "shared", "dev", "nebula", "argocd"]
      service: ["nebula", "argocd", "shared", "kube-*", "default"]
      newBranch: ["main", "master", "*staging*"]

  open_config_pr:
    allow:
      repo: ["twizz-app/*"]
      base: ["*"]
      branch: ["nebula/*"]

  create_branch:
    allow:
      repo: ["twizz-app/*"]
      name: ["*"]
    deny:
      name: ["main", "master", "*prod*", "*staging*"]

  set_env_vars:
    allow:
      name: ["*"]

  rebuild_env:
    allow:
      name: ["*"]

  # ── Release train (docs/NEBULA.md §N4): previews → staging by gitops PR ──
  # `target` is the only tier Nebula may write to; prod is caught by global_deny
  # before this table is even consulted. Tags must be immutable (aliases such as
  # main/dev/latest are refused in code too). The values file, Argo app and host
  # are DERIVED from (service, target) through the registry — never inputs.
  promote_release:
    allow:
      service: ["twizz-sentinel", "twizz-admin"]
      target: ["staging"]
      imageTag: ["build-*", "nb-*", "main-*", "pr-*"]
    deny:
      imageTag: ["main", "latest", "dev", "staging"]

  merge_promotion:
    allow:
      service: ["twizz-sentinel", "twizz-admin"]
      target: ["staging"]
      imageTag: ["build-*", "nb-*", "main-*", "pr-*"]
      pr: ["*"]

  # ── Capacity templates (docs/NEBULA.md §N5): size pods/nodes/Atlas ahead of traffic ──
  # `tier` keys never contain "prod": preview = EKS-Twizz-NonProd, staging =
  # EKS-Moly-staging ns sentinel. `production` is a plan/export pane only and is
  # caught by global_deny before this table. Values files, the NodePool and the
  # Atlas cluster are DERIVED from tier in code; per-tier caps enforced in code.
  # `sizeHash` binds the nonce to the exact sizes confirmed.
  apply_capacity_preset:
    allow:
      tier: ["preview", "staging"]
      preset: ["*"]
      sizeHash: ["*"]

  merge_capacity_pr:
    allow:
      tier: ["preview", "staging"]
      preset: ["*"]
      pr: ["*"]
      headSha: ["*"]                     # the reviewed head; merge refused if it moved

  # Atlas tier: the NonProd cluster only (name derived from tier, never an input).
  set_atlas_tier:
    allow:
      tier: ["preview"]
      instanceSize: ["M10", "M20", "M30", "M40"]
      autoScaling: ["*"]

  # ── Live capacity (docs/NEBULA.md §N5.2): EKS-Moly-staging + EKS-Moly-Prod ──
  # Platform-owner decision 2026-10-14: Nebula adjusts PROD capacity from the UI.
  # `tier: production` is the ONE value exempted from global_deny (this tool,
  # this field only). What it can touch is bounded twice: in code (pair rule,
  # x3 / x0.5 step limits, caps, never delete / never zero) and in Kubernetes
  # RBAC (nebula-capacity: patch deployments/scale/HPAs in default + jobs).
  # `planHash` binds the nonce to the exact ops AND the live values they came from.
  apply_live_capacity:
    exempt_global_deny: [tier]
    allow:
      tier: ["staging", "production"]
      preset: ["*"]
      planHash: ["*"]
    deny:
      preset: ["*prod*"]                 # preset names are free text; keep them clean
