replicaCount: 1

image:
  repository: 848281935985.dkr.ecr.eu-west-1.amazonaws.com/twizz-services
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: ""
  tls:
    enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

env: {}

# ServiceAccount for the workload; set roleArn to bind an IRSA role
# (e.g. twizz-nonprod-preview-pods) for AWS access from the pod.
serviceAccount:
  create: true
  roleArn: ""

# ExternalName services resolving short sibling-service names to another
# namespace, e.g.:
#   externalServices:
#     - { name: ffmpeg-service, target: ffmpeg-service.shared.svc.cluster.local, port: 8888 }
externalServices: []

externalSecret:
  enabled: false
  secretStore: aws-secrets-manager
  remoteRef: ""
  refreshInterval: 1h

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30

ttl: "72h"

namespace:
  resourceQuota:
    enabled: true
    cpu: "2"
    memory: 4Gi
  networkPolicy:
    enabled: true
    # extra ingress source, matched on namespace labels (set on preview
    # namespaces via the ApplicationSet's managedNamespaceMetadata):
    #   allowFromNamespaceLabels: { twizz-idp/preview: "true" }
    allowFromNamespaceLabels: {}
