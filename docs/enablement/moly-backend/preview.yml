# Drop into MymTwo/Moly-backend as .github/workflows/preview.yml
#
# Builds an immutable per-commit image and, on success, adds the `preview`
# label — which is what triggers the Argo CD ApplicationSet to create the
# preview environment. Auth is GitHub OIDC -> twizz-gha-ecr-push (no keys).
name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ECR_REGISTRY: 848281935985.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPO: molybackend

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build-and-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::848281935985:role/twizz-gha-ecr-push
          aws-region: eu-west-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The label is the gate: Argo CD only creates the env once the image exists.
      - name: Add preview label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.number }} --add-label preview --repo ${{ github.repository }}

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://pr-${{ github.event.number }}-moly-backend.prv.twizz.com"
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} \
            --body "🚀 Preview building: $URL (live ~3 min after this comment)" \
            --edit-last --create-if-none
